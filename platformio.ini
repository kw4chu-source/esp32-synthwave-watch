; Zegarki ESP32-WROOM + ILI9488 480x320: wspolny szkielet (src/core) i tarcze
; (src/faces/<nazwa>). Kazda tarcza = osobne srodowisko i osobny .bin
; (dist/<nazwa>_<wersja>.bin -> Cardputer /esp32bin).
; Plytka: ESP32-WROOM (COM3, antena SMD, poprawka RC na EN - flash bez BOOT)
;
;   pio run -e synthwave            pio run -e neon_rain -t upload

[platformio]
default_envs = synthwave

[env]
; pioarduino = Arduino-ESP32 3.x (oficjalna platforma PIO stoi na 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino

; Te klony bootloopuja w QIO - zawsze DIO 40 MHz
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions_4mb_ota.csv
; Aplikacja idzie do ota_0, NIE pod domyslne 0x10000 (tam jest factory = loader)
board_upload.offset_address = 0x110000

upload_port = COM3
upload_speed = 921600
monitor_port = COM3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    lovyan03/LovyanGFX@1.2.32

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -I src

extra_scripts =
    pre:tools/app_info.py
    post:tools/post_build.py

; Nazwa/wersja trafiaja do esp_app_desc_t (patch w post_build.py)
; i do firmware jako APP_NAME / APP_VERSION

[env:synthwave]
build_src_filter = +<core/> +<faces/synthwave/>
custom_app_name = synthwave-watch
custom_app_version = 2.1.0

[env:neon_rain]
build_src_filter = +<core/> +<faces/neon_rain/>
custom_app_name = neon-rain-watch
custom_app_version = 1.1.0

[env:invaders]
build_src_filter = +<core/> +<faces/common_8bit/> +<faces/invaders/>
custom_app_name = invaders-watch
custom_app_version = 1.0.0

[env:fireworks]
build_src_filter = +<core/> +<faces/common_8bit/> +<faces/fireworks/>
custom_app_name = fireworks-watch
custom_app_version = 1.0.0

[env:tunnel]
build_src_filter = +<core/> +<faces/tunnel/>
custom_app_name = tunnel-watch
custom_app_version = 1.0.0

[env:portal]
build_src_filter = +<core/> +<faces/common_hd/> +<faces/portal/>
custom_app_name = portal-watch
custom_app_version = 1.0.0

[env:blackhole]
build_src_filter = +<core/> +<faces/common_hd/> +<faces/blackhole/>
custom_app_name = blackhole-watch
custom_app_version = 1.0.0

[env:aurora]
build_src_filter = +<core/> +<faces/common_hd/> +<faces/aurora/>
custom_app_name = aurora-watch
custom_app_version = 1.0.1

; Benchmark wyswietlacza/ESP32 (plan przyspieszenia renderu) - wyniki na ekranie i Serial [BENCH]
[env:bench]
build_src_filter = +<core/> +<faces/bench/>
custom_app_name = bench-watch
custom_app_version = 1.0.0

; Zorza z SPI 40 MHz - porownanie plynnosci z aurora (26.7 MHz)
[env:aurora40]
build_src_filter = +<core/> +<faces/common_hd/> +<faces/aurora/>
build_flags = ${env.build_flags} -DTFT_SPI_WRITE_HZ_OVERRIDE=40000000
custom_app_name = aurora40-watch
custom_app_version = 1.0.1
